  <script type="module">
    import * as pdfjsLib from '../node_modules/pdfjs-dist/build/pdf.mjs';

    const state = { pdfDoc: null, currentPage: 1, scale: 1.0, originalData: null, filePath: null, fileName: null, currentTool: 'select', isDrawing: false, annotations: {}, undoStack: [], redoStack: [], hasUnsavedChanges: false, formsDirty: false, currentPath: [], pendingStamp: null, pendingImage: null, pendingSignature: null, redactionMarks: {}, textEdits: {} };
    const $ = id => document.getElementById(id);

    function showNotification(msg, type = 'success') { const n = $('notification'); n.textContent = msg; n.className = `notification ${type}`; n.classList.remove('hidden'); setTimeout(() => n.classList.add('hidden'), 3000); }
    function setLoading(show, text = 'Loading...') { $('loadingText').textContent = text; $('loadingOverlay').classList.toggle('hidden', !show); }
    function updateUIState(hasDoc) {
      $('welcomeScreen').classList.toggle('hidden', hasDoc);
      $('sidebar').classList.toggle('hidden', !hasDoc);

    function updateUndoRedo() { $('undoBtn').disabled = state.undoStack.length === 0; $('redoBtn').disabled = state.redoStack.length === 0; }

    function bytesToBase64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
    async function commitFormValues() {
      if (!state.formsDirty) return;
      state.originalData = bytesToBase64(await state.pdfDoc.saveDocument());
      state.formsDirty = false; state.pdfDoc.annotationStorage.resetModified();
    }
    function markFormsDirty() { state.formsDirty = true; setUnsavedChanges(true); }
    const formLinkService = {
      getDestinationHash: () => '#', getAnchorUrl: () => '#', addLinkAttributes() {}, executeNamedAction() {}, executeSetOCGState() {},
      async goToDestination(dest) {
        try {
          const d = typeof dest === 'string' ? await state.pdfDoc.getDestination(dest) : dest;
          if (Array.isArray(d)) goToPage(typeof d[0] === 'object' && d[0] ? await state.pdfDoc.getPageIndex(d[0]) + 1 : d[0] + 1);
        } catch (e) { /* unresolvable destination */ }
      }
    };
    function hexToRgb(hex) { const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return r ? { r: parseInt(r[1], 16) / 255, g: parseInt(r[2], 16) / 255, b: parseInt(r[3], 16) / 255 } : { r: 0, g: 0, b: 0 }; }
    function editSnapshot(extra) {
      const forms = {}; // typed form values: id -> { value }
      if (state.pdfDoc && state.pdfDoc.annotationStorage) for (const [id, v] of Object.entries(state.pdfDoc.annotationStorage.getAll() || {})) if (v && 'value' in v) forms[id] = { value: v.value };
      return JSON.stringify({ ...extra, annotations: state.annotations, redactionMarks: state.redactionMarks, textEdits: state.textEdits, forms });
    }
    // Values in the snapshot are set again; fields typed into since are reset to what the document itself holds
    async function restoreForms(forms) {
      const storage = state.pdfDoc && state.pdfDoc.annotationStorage;
      if (!storage) return;
      for (const [id, v] of Object.entries(forms)) storage.setValue(id, { value: v.value });
      const stale = Object.keys(storage.getAll() || {}).filter(id => !(id in forms));
      if (!stale.length) return;
      const original = {};
      for (let i = 1; i <= state.pdfDoc.numPages; i++) for (const a of await (await state.pdfDoc.getPage(i)).getAnnotations()) original[a.id] = a.checkBox ? a.exportValue === a.fieldValue : a.radioButton ? a.buttonValue === a.fieldValue : a.fieldValue || '';
      for (const id of stale) storage.setValue(id, { value: id in original ? original[id] : '' });
    }
    function saveState(snap = editSnapshot()) { state.undoStack.push(snap); if (state.undoStack.length > 50) state.undoStack.shift(); state.redoStack = []; setUnsavedChanges(true); updateUndoRedo(); }
    // A snapshot of an operation that changes the document itself (Replace) is { doc: json } and carries the document bytes; plain snapshots are strings.
    // Only the newest 5 snapshots keep their bytes: an older one is dropped together with everything below it, since undoing past a missing document state would be wrong.
    function docSnapshot() { return { doc: editSnapshot({ originalData: state.originalData }) }; }
    function trimDocSnapshots(stack, max = 5) {
      let kept = 0;
      for (let i = stack.length - 1; i >= 0; i--) if (typeof stack[i] !== 'string' && ++kept > max) return stack.slice(i + 1);

    async function swapDocument(data) {
      const old = state.pdfDoc;

      if (old) await old.destroy();
      await renderThumbnails();
    }
    async function restoreDocSnapshot(snap) {

    }

    async function redo() { if (state.redoStack.length === 0) return; if (typeof state.redoStack[state.redoStack.length - 1] !== 'string') { state.undoStack.push(docSnapshot()); return restoreDocSnapshot(state.redoStack.pop()); } state.undoStack.push(editSnapshot()); const { forms, ...rest } = JSON.parse(state.redoStack.pop()); Object.assign(state, rest); if (state.pdfDoc) await restoreForms(forms || {}); setUnsavedChanges(true); await renderAllPages(); updateAnnotationCount(); updateUndoRedo(); }

    async function showSplitDialog() {
      if (!state.pdfDoc) { showNotification('Open a PDF first', 'warning'); return; }
      const total = state.pdfDoc.numPages;
      const content = '<div class="form-section-title">Split ' + total + ' pages into:</div>' +
        '<div class="form-group"><label class="form-label"><input type="radio" name="splitMode" value="every" checked> Every</label>' +
        '<input type="number" class="form-input" id="splitEvery" value="1" min="1" style="width:80px;display:inline-block;margin-left:8px;"> pages</div>' +
        '<div class="form-group"><label class="form-label"><input type="radio" name="splitMode" value="ranges"> Custom ranges (e.g. 1-3,5,7-10)</label>' +
        '<input type="text" class="form-input" id="splitRanges" placeholder="1-3,5,7-10" style="margin-top:8px;"></div>';
      showModal('Split PDF', content, [{ label: 'Cancel', action: 'cancel' }, { label: 'Split', action: 'split', primary: true, handler: async m => {
        const mode = m.querySelector('input[name=splitMode]:checked').value;
        let ranges = [];
        if (mode === 'every') {
          const n = Math.max(1, parseInt(m.querySelector('#splitEvery').value, 10) || 1);
          for (let s = 1; s <= total; s += n) ranges.push({ start: s, end: Math.min(s + n - 1, total) });
        } else {
          const raw = m.querySelector('#splitRanges').value.trim();
          if (!raw) { showNotification('Enter ranges like 1-3,5,7-10', 'warning'); return; }
          for (const part of raw.split(',')) { const p = part.split('-'); ranges.push({ start: parseInt(p[0], 10), end: p[1] ? parseInt(p[1], 10) : parseInt(p[0], 10) }); }
        }
        setLoading(true, 'Splitting...');
        try {
          const r = await window.pdfAPI.splitPdf({ data: await buildDocumentData(), ranges });
          if (!r.success) throw new Error(r.error || 'Split failed');
          const baseName = (state.fileName || 'document').replace(/\.pdf$/i, '');
          const files = r.files.map(f => ({ name: baseName + '_' + f.name, data: f.data }));
          const s = await window.pdfAPI.saveMultipleFiles({ files });
          if (!s.success && !s.canceled) throw new Error(s.error || 'Could not save split files');

        } catch (e) { showNotification('Error: ' + e.message, 'error'); }
        setLoading(false);
      } }]);
    }

    async function showExtractPagesDialog() {
      if (!state.pdfDoc) { showNotification('Open a PDF first', 'warning'); return; }
      const content = '<div class="form-group"><label class="form-label">Pages to extract (e.g. 1,3,5-8)</label><input type="text" class="form-input" id="extractPagesInput" placeholder="1,3,5-8"></div>';
      showModal('Extract Pages', content, [{ label: 'Cancel', action: 'cancel' }, { label: 'Extract', action: 'extract', primary: true, handler: async m => {
        const raw = m.querySelector('#extractPagesInput').value.trim();

        const nums = [];
        for (const part of raw.split(',')) { const p = part.split('-'); if (p.length === 2) { for (let i = parseInt(p[0], 10); i <= parseInt(p[1], 10); i++) nums.push(i); } else nums.push(parseInt(p[0], 10)); }

    // Digital page text to document blocks: lines by baseline, items left to right, paragraphs by vertical gap or font-size change, headings by size against the page median.
    function blocksFromTextItems(items, styles) {
      const LIST = /^(?:[•◦▪]\s*|[–-]\s+|\d{1,3}[.)]\s+|[a-z]\)\s+)/i, its = [];
      for (const it of items) {
        if (!it.str) continue; // whitespace-only items are the spaces between differently styled runs (e.g. Word exports)

        its.push({ str: it.str, x: t[4], y: t[5], w: it.width || 0, size: Math.hypot(t[0], t[1]) || it.height || 1, bold: /bold|black|heavy|semibold/i.test(fn), italic: /italic|oblique/i.test(fn) });
      }
      if (!its.length) return [];

      const bySize = its.filter(i => i.str.trim()).map(i => [i.size, i.str.trim().length]).sort((a, b) => a[0] - b[0]), half = bySize.reduce((n, [, c]) => n + c, 0) / 2;
      let med = bySize.length ? bySize[bySize.length - 1][0] : 1;
      for (let acc = 0, k = 0; k < bySize.length; k++) if ((acc += bySize[k][1]) >= half) { med = bySize[k][0]; break; }
      const add = (runs, text, bold, italic) => {
        const last = runs[runs.length - 1];
        if (last && !!last.bold === bold && !!last.italic === italic) last.text += text;
        else runs.push({ text, ...(bold && { bold: true }), ...(italic && { italic: true }) });
      };
      const rows = [];
      for (const it of its.slice().sort((a, b) => b.y - a.y)) {
        const cur = rows[rows.length - 1];
        if (cur && Math.abs(cur.y - it.y) <= 0.5 * med) cur.items.push(it); else rows.push({ y: it.y, items: [it] });
      }
      const lines = rows.map(r => {
        const sorted = r.items.sort((a, b) => a.x - b.x), runs = [], chars = new Map();
        sorted.forEach((it, k) => {
          const prev = sorted[k - 1];

          chars.set(it.size, (chars.get(it.size) || 0) + it.str.length);

      });

        if (prev && !(prev.y - ln.y > 1.5 * prev.size * 1.2 || Math.abs(ln.size - prev.size) / prev.size > 0.15 || LIST.test(ln.text))) {

          add(p.runs, ' ', !!p.runs[p.runs.length - 1].bold, !!p.runs[p.runs.length - 1].italic);
          ln.runs.forEach(r => add(p.runs, r.text, !!r.bold, !!r.italic));

        const text = p.runs.map(r => r.text).join(''), ratio = p.size / med;

        const boldHeading = p.runs.every(r => r.bold || !r.text.trim()) && text.length <= 80 && text.split(/\s+/).length <= 10 && !/[.:,;]$/.test(text) && !LIST.test(text);

    $('searchNext').onclick = () => gotoMatch(1); $('searchPrev').onclick = () => gotoMatch(-1);
    $('searchCase').onclick = () => { $('searchCase').classList.toggle('active'); runFind(); }; $('searchWord').onclick = () => { $('searchWord').classList.toggle('active'); runFind(); };
    $('searchReplaceToggle').onclick = () => { $('replaceRow').classList.toggle('hidden'); if (!$('replaceRow').classList.contains('hidden')) $('replaceInput').focus(); };
    $('replaceOne').onclick = () => replaceMatches(false); $('replaceAll').onclick = () => replaceMatches(true);
    $('replaceInput').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); replaceMatches(e.ctrlKey || e.metaKey); } if (e.key === 'Escape') hideSearch(); };
    $('imageBtn').onclick = async () => { const img = await window.pdfAPI.selectImage(); if (img) { state.pendingImage = img; selectTool('image'); showNotification('Click to place image', 'info'); } };
    $('signatureBtn').onclick = () => showSignatureDialog();
    document.addEventListener('mousedown', e => { if (state.sigSel && !e.target.closest('.sig-hit')) setSigSel(null); });
    document.querySelectorAll('.sidebar-tab').forEach(tab => { tab.onclick = () => { document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); $('thumbnailContainer').classList.toggle('hidden', tab.dataset.tab !== 'thumbnails'); $('bookmarksContainer').classList.toggle('hidden', tab.dataset.tab !== 'bookmarks'); }; });
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && state.sigSel && state.currentTool === 'select' && !document.querySelector('.modal-overlay')) { e.preventDefault(); deleteSelectedAnnotation(); return; }
      if (FIELD_TOOL_LABELS[state.currentTool] && !document.querySelector('.modal-overlay')) {
        if (e.key === 'Escape') { state.isDrawing = false; state.currentPath = []; document.querySelectorAll('.annotation-layer').forEach(l => { const pg = l.dataset.page; if (pg) renderAnnotations(+pg); }); selectTool('select'); return; }
        if ((e.key === 'Delete' || e.key === 'Backspace') && state.currentTool === 'editFields' && state.fieldSel) { e.preventDefault(); const { pageNum, ref } = state.fieldSel; removeFormField(pageNum, ref); return; }
      }
      if (e.ctrlKey || e.metaKey) { switch (e.key.toLowerCase()) { case 'n': e.preventDefault(); createNewPdf(); break; case 'o': e.preventDefault(); openFile(); break; case 's': e.preventDefault(); saveDocument(e.shiftKey); break; case 'z': e.preventDefault(); e.shiftKey ? redo() : undo(); break; case 'y': e.preventDefault(); redo(); break; case 'f': e.preventDefault(); showSearch(); break; case 'h': e.preventDefault(); showReplace(); break; case '=': case '+': e.preventDefault(); setZoom(state.scale + 0.25); break; case '-': e.preventDefault(); setZoom(state.scale - 0.25); break; case '0': e.preventDefault(); setZoom(1); break; } }
      else { switch (e.key.toLowerCase()) { case 'v': selectTool('select'); break; case 'h': selectTool('hand'); break; case 't': selectTool('text'); break; case 'p': selectTool('draw'); break; case 'e': selectTool('eraser'); break; case 'l': selectTool('line'); break; case 'a': selectTool('arrow'); break; case 'r': selectTool('rectangle'); break; case 'c': selectTool('circle'); break; } }
    });

    window.pdfAPI.onMenuNew(createNewPdf); window.pdfAPI.onMenuOpen(openFile); window.pdfAPI.onMenuSave(() => saveDocument()); window.pdfAPI.onMenuSaveAs(() => saveDocument(true));
    window.pdfAPI.onMenuMerge(mergePdfs); window.pdfAPI.onMenuPrint(() => window.pdfAPI.printDocument()); window.pdfAPI.onMenuProperties(showDocumentProperties);
    window.pdfAPI.onMenuSplit(showSplitDialog); window.pdfAPI.onMenuExtractPages(showExtractPagesDialog); window.pdfAPI.onMenuExportPages(showExtractPagesDialog);
    window.pdfAPI.onMenuSetPassword(showSetPasswordDialog); window.pdfAPI.onMenuRemovePassword(showRemovePasswordDialog);
    window.pdfAPI.onMenuOpenRecent(async p => { try { const r = await window.pdfAPI.openSpecificFile(p); if (r && r.data) await loadPdf(r); else showNotification('File not accessible: ' + p, 'error'); } catch (e) { showNotification('Error: ' + e.message, 'error'); } });
    window.pdfAPI.onMenuExportImages(exportImages); window.pdfAPI.onMenuExportDocx(showExportDocxDialog); window.pdfAPI.onMenuExportXlsx(exportXlsx);
    window.pdfAPI.onMenuOcr(() => runOcr()); window.pdfAPI.onMenuOcrAi(() => runOcr('ai')); window.pdfAPI.onMenuSmartExtract(runSmartExtract); window.pdfAPI.onMenuEngineSetup(showEngineSetup);
    window.pdfAPI.onMenuToggleBookmarks(() => activateSidebarTab('bookmarks')); window.pdfAPI.onMenuToggleThumbnails(() => activateSidebarTab('thumbnails'));
    window.pdfAPI.onMenuInsertFromFile(showInsertFromFile);
    window.pdfAPI.onMenuReplacePage(showReplacePage); window.pdfAPI.onMenuCropPage(startCrop); window.pdfAPI.onMenuRemoveCrop(removeCrop); window.pdfAPI.onMenuResizePage(showResizeDialog); window.pdfAPI.onMenuCompress(showCompressDialog);
    window.pdfAPI.onMenuAddPageNumbers(showPageNumbersDialog); window.pdfAPI.onMenuAddHeaderFooter(showHeaderFooterDialog);
    window.pdfAPI.onMenuGotoPage(showGotoPageDialog);
    window.pdfAPI.onMenuShortcuts(showShortcutsDialog);

    // Drag & drop PDF/image open
    document.addEventListener('dragover', e => e.preventDefault());
    async function openDroppedFiles(files) {
      const list = Array.from(files || []);
      if (!list.length) return;
      const readB64 = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(f); });
      if (list.length === 1 && /\.pdf$/i.test(list[0].name)) {
        await loadPdf({ data: await readB64(list[0]), path: null, name: list[0].name });
      } else if (list.every(f => /\.(png|jpe?g)$/i.test(f.name))) {
        const r = await window.pdfAPI.imagesToPdf(await Promise.all(list.map(async f => ({ name: f.name, data: await readB64(f) }))));
        if (!r.success) { showNotification(r.error, 'error'); return; }
        await loadPdf({ data: r.data, path: null, name: r.name });
      } else showNotification('Drop one PDF, or one or more PNG/JPEG images', 'warning');
    }
    document.addEventListener('drop', async e => {
      e.preventDefault();
      if (e.dataTransfer.types && e.dataTransfer.types.includes('application/x-pdf-page')) return; // page reorder, not file open
      await openDroppedFiles(e.dataTransfer && e.dataTransfer.files);
    });
    window.pdfAPI.onMenuUndo(undo); window.pdfAPI.onMenuRedo(redo); window.pdfAPI.onMenuFind(showSearch); window.pdfAPI.onMenuReplace(showReplace);
    window.pdfAPI.onMenuZoomIn(() => setZoom(state.scale + 0.25)); window.pdfAPI.onMenuZoomOut(() => setZoom(state.scale - 0.25)); window.pdfAPI.onMenuZoomReset(() => setZoom(1));
    window.pdfAPI.onMenuTool(t => selectTool(t === 'editFields' && state.currentTool === 'editFields' ? 'select' : t)); window.pdfAPI.onMenuRotate(rotatePage); window.pdfAPI.onMenuRotateAll(rotateAllPages); window.pdfAPI.onMenuDeletePage(deletePage); window.pdfAPI.onMenuInsertPage(insertBlankPage);
    window.pdfAPI.onMenuAddWatermark(showWatermarkDialog); window.pdfAPI.onMenuFlattenForm(flattenForm); window.pdfAPI.onMenuMakeFillable(makeFillable); window.pdfAPI.onMenuProfiles(() => showProfiles()); window.pdfAPI.onMenuAutofill(fillFromProfile); window.pdfAPI.onMenuSignDocument(showSignDocument); window.pdfAPI.onMenuSaveAnswers(saveAnswersToProfile); window.pdfAPI.onMenuProfileFromDoc(profileFromDocument);
    window.pdfAPI.onMenuStamp(s => { state.pendingStamp = s; selectTool('stamp'); showNotification('Click to place stamp', 'info'); });
    window.pdfAPI.onMenuAddImage(async () => { const img = await window.pdfAPI.selectImage(); if (img) { state.pendingImage = img; selectTool('image'); showNotification('Click to place image', 'info'); } });
    window.pdfAPI.onMenuGoto(d => { if (d === 'first') goToPage(1); else if (d === 'last') goToPage(state.pdfDoc.numPages); else if (d === 'prev' && state.currentPage > 1) goToPage(state.currentPage - 1); else if (d === 'next' && state.currentPage < state.pdfDoc.numPages) goToPage(state.currentPage + 1); });

    initPdfJs();
    setupTextSelectionEditing();

    // restore saved theme
    (async () => { const t = await window.pdfAPI.getTheme(); if (t === 'dark') document.body.dataset.theme = 'dark'; })();

    // theme toggle from menu
    window.pdfAPI.onMenuToggleTheme(toggleTheme);

    // save-then-quit flow (from unsaved-changes close dialog)
    window.pdfAPI.onQuitSave(async () => { if (await saveDocument(false)) await window.pdfAPI.forceClose(); });

    // Auto-open file passed on the command line
    (async () => { const f = await window.pdfAPI.getInitialFile(); if (f) { const r = await window.pdfAPI.openSpecificFile(f); if (r && r.data) await loadPdf(r); } })();
  </script>
</body>
</html>
