name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: npx electron-builder --linux AppImage deb --x64 --publish never
            exe: dist/linux-unpacked/pagewise
          - os: windows-latest
            build: npx electron-builder --win nsis portable --x64 --publish never
            exe: dist/win-unpacked/Pagewise.exe
          - os: macos-latest
            build: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
            exe: dist/mac-arm64/Pagewise.app/Contents/MacOS/Pagewise
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.build }}
        shell: bash
      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke-test.cjs "${{ matrix.exe }}" --no-sandbox
      - name: Smoke-test packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke-test.cjs "${{ matrix.exe }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: pagewise-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Pagewise ${{ github.ref_name }}" \
            --generate-notes --draft
